llbar{display:none;}</style></head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin"><div class="flex flex-col w-full max-w-sm mx-auto justify-center min-h-[calc(100vh-4rem)] py-6 px-1">
<div class="flex flex-col items-center text-center mb-8">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center p-2 mb-3.5 shadow-sm relative group">
<img alt="The Bookish Club Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1U7CnGS95r0P8uclySHrB_IP_wtKo_S7TESVpQ9Lxpv2R9wulCVnU9Hnj7dPaKgn1M-fcPaFGsgb1ISi6rC9NIQmuibPIeZz-KOx1Vb2-eC0gUM5WH7R_0BFOxLNLr-EqMQI7jb-Utyy1QlQO0VyG_hBMc6tDPGaS_5NIlnIoncpE9xaH8qELLa-iaDOXrDgFJZyVEfRXv2vPHXFczhD_bSQ8KcyZcQeUs5qQKeCVpLNH59cQmA1t57atI"/>
<div class="absolute -inset-1 rounded-full bg-secondary-fixed/30 -z-10 blur-sm"></div>
</div>
<span class="font-headline-lg text-display-lg text-primary tracking-wide leading-tight mb-1" style="font-family: 'Noto Serif', serif; font-style: italic;">
      The Bookish Club
    </span>
<div class="flex items-center gap-2">
<span class="h-px w-6 bg-outline-variant/60"></span>
<p class="font-title-md text-title-md text-secondary tracking-normal">
        نادي الكتّاب
      </p>
<span class="h-px w-6 bg-outline-variant/60"></span>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 sm:p-7 shadow-[0_4px_20px_-4px_rgba(65,40,23,0.06)] relative overflow-hidden">
<div class="text-center mb-6">
<div class="inline-flex items-center justify-center gap-1.5 px-3 py-1 rounded-full bg-surface-container mb-3 text-secondary">
<span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
<span class="font-label-sm text-label-sm font-semibold">بوابة الإدارة</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-semibold mb-1">
        تسجيل دخول المشرف
      </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        أهلاً بك مجدداً في مساحتك الأدبية الخاصة
      </p>
</div>
<form class="space-y-4" id="admin-login-form" onsubmit="event.preventDefault(); handleAdminLogin();">
<div class="flex flex-col gap-1.5 text-right">
<label class="font-label-lg text-label-lg text-primary font-medium flex items-center justify-between" for="email">
<span>البريد الإلكتروني</span>
<span class="text-error font-body-sm hidden" id="email-error">مطلوب</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 pl-11 text-right bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#5a3e2b]" dir="ltr" id="email" name="email" placeholder="admin@bookishclub.com" required="" type="email"/>
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            mail
          </span>
</div>
</div>
<div class="flex flex-col gap-1.5 text-right">
<label class="font-label-lg text-label-lg text-primary font-medium flex items-center justify-between" for="password">
<span>كلمة المرور</span>
<span class="text-error font-body-sm hidden" id="password-error">مطلوب</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 px-4 pl-11 text-right bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl tracking-widest transition-all duration-200 outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#5a3e2b]" dir="ltr" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="تبديل ظهور كلمة المرور" class="absolute left-3 p-1 text-outline hover:text-primary transition-colors flex items-center justify-center rounded-lg focus:outline-none" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-primary-container accent-primary-container cursor-pointer" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface-variant">تذكرني في هذه الجلسة</span>
</label>
</div>
<button class="w-full h-12 mt-2 bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-title-md text-title-md font-semibold rounded-xl flex items-center justify-center gap-2 shadow-sm transition-all duration-200" id="submit-btn" type="submit">
<span>دخول</span>
<span class="material-symbols-outlined text-[18px] transform rotate-180">arrow_forward</span>
</button>
<div class="text-center pt-2">
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors underline-offset-4 hover:underline" href="#forgot-password">
          نسيت كلمة المرور؟
        </a>
</div>
</form>
</div>
<div class="flex flex-col items-center text-center mt-8 gap-2">
<div class="flex items-center gap-1.5 text-outline">
<span class="material-symbols-outlined text-[16px]">menu_book</span>
<span class="font-label-sm text-label-sm">منصة مجتمع القراءة المعرفي</span>
</div>
<p class="font-label-sm text-label-sm text-outline-variant">
      نظام إدارة نادي القراءة الخاص • النسخة ٢.٤
    </p>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    
    if (!passwordInput || !eyeIcon) return;
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
      passwordInput.classList.remove('tracking-widest');
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
      passwordInput.classList.add('tracking-widest');
    }
  }

  function handleAdminLogin() {
    const btn = document.getElementById('submit-btn');
    if (!btn) return;
    
    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[20px]">sync</span>
      <span>جارٍ التحقق...</span>
    `;
    
    setTimeout(() => {
      btn.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>مرحباً بك</span>
      `;
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }, 1500);
    }, 1000);
  }
</script></main></body></html>
